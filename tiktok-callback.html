<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connecting TikTok – Hearts in Sujood</title>
<style>
  body{font-family:Georgia,serif;max-width:640px;margin:48px auto;padding:0 16px;line-height:1.6;background:#fdfbf7;color:#222}
  h1{color:#1f4d3a;font-size:1.5em}
  #box{display:none;margin-top:24px;padding:16px;border:1px solid #d9d2c3;border-radius:10px;background:#fff}
  code{display:block;word-break:break-all;font-size:15px;background:#f3efe6;padding:12px;border-radius:8px;margin:8px 0}
  button{background:#1f4d3a;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer}
  .err{color:#a33}
</style>
</head>
<body>
<h1>Connecting your TikTok account…</h1>
<p id="msg">Sending you back to the Hearts in Sujood app on your computer.</p>
<div id="box">
  <p>If the app is still waiting, copy this code and paste it into the Ubuntu window, then press Enter:</p>
  <code id="code"></code>
  <button id="copy">Copy code</button>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var code = q.get("code");
  var msg = document.getElementById("msg");
  if (q.get("error")) {
    msg.className = "err";
    msg.textContent = "TikTok said: " + (q.get("error_description") || q.get("error")) + ". Please run the connect command again.";
  } else if (code) {
    document.getElementById("code").textContent = code;
    document.getElementById("copy").onclick = function () {
      navigator.clipboard.writeText(code).then(function () { document.getElementById("copy").textContent = "Copied ✓"; });
    };
    var showCode = function () {
      msg.textContent = "Almost done.";
      document.getElementById("box").style.display = "block";
    };
    var t = setTimeout(showCode, 4000);
    fetch("http://127.0.0.1:3455/callback/" + location.search, {mode: "no-cors"})
      .then(function () {
        clearTimeout(t);
        msg.textContent = "✅ TikTok connected. You can close this tab and check the Ubuntu window.";
      })
      .catch(function () { clearTimeout(t); showCode(); });
  } else {
    msg.textContent = "This page is used only when connecting the Hearts in Sujood publishing tool to TikTok.";
  }
</script>
</body>
</html>
